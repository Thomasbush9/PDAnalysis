[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PDAnalysis"
version = "0.0.3"
description = "Software for analysing deformation between protein structures."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"

authors = [
  { name = "John M. McBride", email = "jmmcbride@protonmail.com" }
]

keywords = ["science", "biology", "biophysics", "molecular", "structural"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: C",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "numpy>=1.22.3",
  "biopython>=1.80",
  "pandas>=1.4.4",
  "scipy>=1.5.0",
  "mpi4py>=4.1.1",
  "joblib>=1.4.2",
  "mpich>=4.3.2",
]

[project.urls]
Homepage = "https://github.com/mirabdi/PDAnalysis"

[project.scripts]
pdanalysis = "PDAnalysis.main:main"

[tool.setuptools]
packages = { find = {} }

